name: Security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - name: Reject committed environment and key material
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)' | grep -v -E '(^|/)\.env\.example$'; then
            echo "Tracked secret-bearing file detected."
            exit 1
          fi
